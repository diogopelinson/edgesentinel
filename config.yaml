edgesentinel:
  poll_interval_seconds: 5

  sensors:
    - id: cpu_temp
      type: cpu_temperature
    - id: cpu_usage
      type: cpu_usage
    - id: memory_usage
      type: memory_usage

  inference:
    enabled: true
    backend: onnx
    model_path: models/anomaly.onnx
    service_url: "http://localhost:8080"
    model_id: "yolo_v8n"

  exporter:
    port: 8000
    use_otel: false

  # histórico local de regras disparadas — uma linha por disparo, em SQLite
  # eventos mais velhos que retention_days são removidos ao iniciar
  event_store:
    enabled: true
    path: data/events.db
    retention_days: 30

  cameras:
    - sensor_id: camera_01
      source: "rtsp://admin:senha@192.168.1.100:554/stream"
      name: "Camera Entrada"
      fps_limit: 1.0
      simulated: true
      simulated_mode: person

  yolo:
    enabled: true
    model_path: models/yolov8n.pt
    target_classes: [person, car, truck]
    confidence: 0.5

  # severity: info | warning | critical  (padrão: warning)
  # define o nível do log e, mais adiante, o peso do evento no histórico
  rules:
    - name: alta_temperatura
      condition:
        sensor_id: cpu_temp
        operator: ">"
        threshold: 75.0
      severity: warning
      actions: [log, webhook]
      cooldown_seconds: 60

    - name: temperatura_critica
      condition:
        sensor_id: cpu_temp
        operator: ">"
        threshold: 85.0
      severity: critical
      actions: [log, webhook]
      cooldown_seconds: 30

    - name: uso_alto_cpu
      condition:
        sensor_id: cpu_usage
        operator: ">"
        threshold: 80.0
      severity: warning
      actions: [log, webhook]
      cooldown_seconds: 30

  actions:
    - id: log
      type: log
    - id: webhook
      type: webhook
      url: "https://webhook.site/8d1d0a84-9978-4d2d-b447-507653eecbe7"