models:
  - id: yolo_v8n
    type: yolo
    path: weights/yolov8n.pt
    description: "YOLOv8 nano — detecção de objetos"
    target_classes: [person, car, truck, bicycle]
    confidence_threshold: 0.5

  # gerado por scripts/train_model.py — a normalização já vem dentro do modelo
  - id: anomaly_onnx
    type: onnx
    path: weights/anomaly.onnx
    description: "IsolationForest + distância à faixa de treino — anomalia de sensor"
    confidence_threshold: 0.6