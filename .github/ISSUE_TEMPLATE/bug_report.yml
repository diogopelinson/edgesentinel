name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For anything with a security impact, do not open an issue —
        follow [SECURITY.md](https://github.com/diogopelinson/edgesentinel/blob/main/SECURITY.md).

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: And where the documentation says so, if it does.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the relevant log lines, not a screenshot of them.
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: >
        The commands you ran, in order. If it only happens with a particular
        config, the smallest config.yaml that still shows it — with secrets
        removed.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `edgesentinel doctor`
      description: It reports the Python version, the optional packages and the sensors your machine exposes.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`edgesentinel --version`, or the commit you are on."
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Where it runs
      options:
        - Raspberry Pi or another SBC
        - Linux server or desktop
        - Windows (simulation)
        - macOS (simulation)
        - Container
    validations:
      required: true
