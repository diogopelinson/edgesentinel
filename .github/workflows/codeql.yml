name: code scanning

# Procura a classe de defeito que teste não pega: caminho vindo de YAML,
# requisição montada com dado de config, chamada de sistema com entrada externa.
# Roda também agendado, porque as regras do CodeQL mudam sem o código mudar.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"      # segunda-feira, 06:41 UTC
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL · python
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write    # é como o alerta chega na aba de segurança

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-and-quality traz regras de manutenção junto com as de
          # segurança; fica para depois de o volume das de segurança ser
          # conhecido — alerta demais cedo demais vira alerta desligado
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
