[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesentinel"
dynamic = ["version"]
description = "Intelligent observability for Linux embedded devices"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0.3",
    "prometheus-client>=0.26.0",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
onnx   = ["onnxruntime>=1.24.3"]
tflite = ["tflite-runtime>=2.14"]
gpio   = ["gpiozero>=2.0.1.post3"]
camera = ["opencv-python>=5.0.0.93", "ultralytics>=8.4.157"]
otel   = [
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.40",
]
all    = [
    "onnxruntime>=1.24.3",
    "tflite-runtime>=2.14",
    "gpiozero>=2.0.1.post3",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.157",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.40",
]

[project.scripts]
edgesentinel = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "config*", "adapters*", "application*"]

# fonte única da versão: cli/__init__.py
[tool.setuptools.dynamic]
version = {attr = "cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 110
exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Conjunto inicial: o que aponta defeito, não o que reformata. Regra nova entra
# uma por vez, com o diff dela separado.
select = ["E", "W", "F", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # o alinhamento de colunas em tabelas de constantes e em mensagens de log é
    # deliberado; reflow automático destruiria o que ele organiza
    "E501",
    # 'except Exception' é decisão de arquitetura aqui: falha de rede, disco ou
    # hardware é logada e engolida para que o alerta ainda saia
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# dict(campo=valor) nas fixtures é kwargs sendo montado para **expansão logo
# depois; reescrever como literal esconde o que aquilo é
"tests/**" = ["B011", "C408"]

[tool.mypy]
# tipo é contrato no core; nos adapters, biblioteca externa sem stub vira ruído
files = ["core", "application"]
strict = true
